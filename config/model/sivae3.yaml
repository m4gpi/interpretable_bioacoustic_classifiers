_target_: src.core.models.sivae3.SIVAE
latent_dim: 128
frequency_dim: 64
frame_window_length: 192
frame_padding_mode: circular
translation_mode: bicubic
translation_idx: 2
cross_decode_method: soft
beta: 1.0
gamma: 1.0
sigma_x: 0.2
sigma_z_min: 1.e-5
x_i_frame_prob: 0.5
delta_prob_step_start: 0
delta_prob_step_end: 0
delta_prob_min: 1.0
delta_prob_max: 1.0
delta_sigma_min: 1.0
delta_sigma_max: 1.0
delta_sigma_step_slope: 0.4
delta_sigma_step_start: 0
delta_sigma_step_end: 20_000
front_end:
  _target_: src.core.transforms.log_mel_spectrogram.LogMelSpectrogram
  sample_rate: 48000
  num_fft: 512
  fft_window_length: 512
  fft_hop_length: 384
  num_mel_bins: ${model.frequency_dim}
  mel_min_hertz: 150
  mel_max_hertz: 15_000
  mel_scaling_factor: 4581.0
  mel_break_frequency: 1_750.0
feature_encoder:
  _target_: src.core.models.components.CNNFeatureEncoder
  in_channels: 1
  block_sizes: [8, 16, 32, 64, 128]
  block_width: 4
  block_depth: 3
  block_resample: [CONV_DOWN, CONV_DOWN, CONV_DOWN, CONV_DOWN]
  padding_mode: circular
  activation: LEAK
  norm_type: LN
  dropout_prob: 0.2
content_encoder:
  _target_: src.core.models.components.ContentEncoder
  in_channels: ${mul:${model.feature_encoder.block_sizes.4}, ${model.feature_encoder.block_width}}
  out_channels: ${div:${mul:${model.feature_encoder.block_sizes.4}, ${model.feature_encoder.block_width}},4}
  layer_sizes:
    - ${div:${mul:${mul:${div:${model.front_end.num_mel_bins},${pow:2,${sub:${len:${model.feature_encoder.block_sizes}},1}}},${div:${model.frame_window_length},${pow:2,${len:${model.feature_encoder.block_sizes}}}}},${mul:${model.feature_encoder.block_sizes.4}, ${model.feature_encoder.block_width}}},4}
    - ${div:${div:${mul:${mul:${div:${model.front_end.num_mel_bins},${pow:2,${sub:${len:${model.feature_encoder.block_sizes}},1}}},${div:${model.frame_window_length},${pow:2,${len:${model.feature_encoder.block_sizes}}}}},${mul:${model.feature_encoder.block_sizes.4}, ${model.feature_encoder.block_width}}},4},2}
    - "${mul:${model.latent_dim},2}"
  dropout_prob: 0.1
  activation: LEAK
alignment_encoder:
  _target_: src.core.models.components.XAlignmentEncoder
  out_features: 2
  x_channels: ${mul:${model.feature_encoder.block_sizes.4}, ${model.feature_encoder.block_width}}
  x_time_dim: ${div:${model.frame_window_length},${pow:2,${len:${model.feature_encoder.block_sizes}}}}
  x_freq_dim: ${div:${model.front_end.num_mel_bins},${pow:2,${sub:${len:${model.feature_encoder.block_sizes}},1}}}
  activation: ATAN2
content_decoder:
  _target_: src.core.models.components.ContentDecoder
  in_channels: ${div:${mul:${model.feature_encoder.block_sizes.4}, ${model.feature_encoder.block_width}},4}
  out_channels: ${mul:${model.feature_encoder.block_sizes.4}, ${model.feature_encoder.block_width}}
  out_height: ${div:${model.frame_window_length},${pow:2,${len:${model.feature_encoder.block_sizes}}}}
  out_width: ${div:${model.front_end.num_mel_bins},${pow:2,${sub:${len:${model.feature_encoder.block_sizes}},1}}}
  layer_sizes:
    - "${model.latent_dim}"
    - ${div:${div:${mul:${mul:${div:${model.front_end.num_mel_bins},${pow:2,${sub:${len:${model.feature_encoder.block_sizes}},1}}},${div:${model.frame_window_length},${pow:2,${len:${model.feature_encoder.block_sizes}}}}},${mul:${model.feature_encoder.block_sizes.4}, ${model.feature_encoder.block_width}}},4},2}
    - ${div:${mul:${mul:${div:${model.front_end.num_mel_bins},${pow:2,${sub:${len:${model.feature_encoder.block_sizes}},1}}},${div:${model.frame_window_length},${pow:2,${len:${model.feature_encoder.block_sizes}}}}},${mul:${model.feature_encoder.block_sizes.4}, ${model.feature_encoder.block_width}}},4}
  dropout_prob: 0.1
  activation: LEAK
feature_decoder:
  _target_: src.core.models.components.CNNFeatureDecoder
  out_channels: 1
  block_sizes: [128, 64, 32, 16, 8]
  block_width: 4
  block_depth: 3
  block_resample: [CONV_UP, CONV_UP, CONV_UP, CONV_UP]
  padding_mode: circular
  activation: LEAK
  norm_type: LN
  dropout_prob: 0.2

_target_: src.core.models.species_vae.SpeciesVAE
sigma_x: 0.2
sample_rate: 48000
num_fft: 512
fft_window_length: 512
fft_hop_length: 384
num_mel_bins: 64
mel_min_hertz: 150
mel_max_hertz: 15_000
mel_scaling_factor: 4581.0
mel_break_frequency: 1_750.0
frame_window_length: 192
latent_dim: 128
weight_init_std: 1.e-2
cnn_block_width: 4
cnn_block_depth: 3
cnn_dropout_prob: 0.2
cnn_padding_mode: circular
cnn_activation: LEAK
mlp_activation: LEAK
mlp_dropout_prob: 0.1
frame_padding_mode: circular
learning_rate: 4.e-5

attn_dim: 10
clf_learning_rate: 1.e-1
attn_learning_rate: 5.e-4
l1_penalty: 1.e-2
attn_weight_decay: 1.e-2
beta: 0.0
label_smoothing: 0.0

optimiser_cls: torch.optim.AdamW
scheduler_cls: torch.optim.lr_scheduler.CosineAnnealingLR
scheduler_config:
  T_max: 40_000
  eta_min: 4.e-7

_target_: src.core.models.sivae.SIVAE
latent_dim: 128
frequency_dim: 64
frame_window_length: 192
frame_padding_mode: circular
translation_mode: bicubic
translation_idx: 3
cross_decode_method: soft
beta: 1.0
gamma: 1.0
sigma_x: 0.2
sigma_z_min: 1.e-5
learning_rate: 4.e-5
delta_prob_step_start: 0
delta_prob_step_end: 0
delta_prob_min: 1.0
delta_prob_max: 1.0
delta_sigma_min: 1.0
delta_sigma_max: 1.0
delta_sigma_step_slope: 0.4
delta_sigma_step_start: 0
delta_sigma_step_end: 20_000
optimiser_cls: torch.optim.AdamW
scheduler_cls: torch.optim.lr_scheduler.CosineAnnealingLR
scheduler_config:
  eta_min: 1.e-5
  T_max: 180000
scheduler_interval: step
scheduler_frequency: 1

_target_: src.core.models.sivae.SIVAE
# preprocessing
sample_rate: 48000
num_fft: 512
fft_window_length: 512
fft_hop_length: 384
num_mel_bins: 64
mel_min_hertz: 150
mel_max_hertz: 15_000
mel_scaling_factor: 4581.0
mel_break_frequency: 1_750.0
# architecture
weight_init_std: 1.e-2
cnn_block_width: 4
cnn_block_depth: 3
cnn_dropout_prob: 0.2
cnn_padding_mode: circular
frame_window_length: 192
frame_padding_mode: circular
cnn_activation: LEAK
mlp_activation: LEAK
mlp_dropout_prob: 0.1
latent_dim: 128
# tuning
sigma_x: 0.2
sigma_z_min: 0.0498
k: 2
delta_sigma_min: 0.1
delta_sigma_max: 2.0
delta_sigma_step_slope: 0.4
delta_sigma_step_start: 0
delta_sigma_step_end: 20_000
# optimiser
learning_rate: 4.e-5
optimiser_cls: torch.optim.AdamW
scheduler_cls: torch.optim.lr_scheduler.CosineAnnealingLR
scheduler_config:
  T_max: 40_000
  eta_min: 4.e-7

# @package _global_

# python main.py +experiment=sivae
defaults:
  - override /model: sivae
  - override /trainer: gpu
  - override /logger: wandb

trainer:
  max_steps: 180_000
  max_epochs: -1
  log_every_n_steps: 50
  val_check_interval: 2500

callbacks:
  primary_model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.checkpoint_dir}/sivae/${run_id}
    filename: '{step}'
    every_n_train_steps: 20_000
    save_top_k: -1
  vae_metrics:
    _target_: src.core.callbacks.vae_metrics.VAEMetrics
    model_name: ${run_id}
    dataset_name: ${data._target_}
    save_path: ${paths.results_dir}/metrics.parquet/${run_id}.parquet
  vae_embeddings:
    _target_: src.core.callbacks.vae_embeddings.VAEEmbeddings
    frame_hop_length: 96
    save_path: ${paths.results_dir}

logger:
  wandb:
    id: ${run_id}
    project: soundscape_vae_pt
    group: sivae

# @package _global_

# python main.py +experiment=sivae
defaults:
  - override /algorithm: soundscape_vae
  - override /model: sivae3
  - override /trainer: gpu
  - override /logger: wandb

trainer:
  max_steps: 180_000
  max_epochs: -1
  log_every_n_steps: 1000
  val_check_interval: 2500

callbacks:
  primary_model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.checkpoint_dir}/${version}
    filename: '{step}'
    every_n_train_steps: 40_000
    save_top_k: -1
  secondary_model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.checkpoint_dir}/${version}/intervals
    filename: '{step}'
    every_n_train_steps: 5_000
    save_top_k: 1
  sivae_metrics:
    _target_: src.core.callbacks.sivae_metrics.SIVAEMetrics
    save_path: ${paths.results_dir}/sivae_metrics.parquet
  vae_metrics:
    _target_: src.core.callbacks.vae_metrics.VAEMetrics
    save_path: ${paths.results_dir}/vae_metrics.parquet
  vae_embeddings:
    _target_: src.core.callbacks.vae_embeddings.VAEEmbeddings
    frame_hop_length: 96
    save_path: ${paths.results_dir}/features.parquet

logger:
  wandb:
    id: ${run_id}
    project: spectral_bias_adjustment
    group: sivae

# @package _global_

# python main.py +experiment=sivae
version: v101

defaults:
  - override /model: sivae
  - override /trainer: gpu
  - override /logger: wandb

trainer:
  max_steps: 180_000
  max_epochs: -1
  log_every_n_steps: 1000
  val_check_interval: 2500

callbacks:
  primary_model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ./checkpoints/sivae.pt:v1
    filename: '{step}'
    every_n_train_steps: 60_000
    save_top_k: -1
  secondary_model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ./checkpoints/sivae.pt:v1/intervals
    filename: '{step}'
    every_n_train_steps: 5_000
    save_top_k: 1
  # spectrogram_logger:
  #   _target_: src.core.callbacks.spectrogram_logger.SpectrogramLogger
  #   log_every_n_train_steps: 500
  #   log_every_n_val_steps: 5
  #   num_train_samples_per_batch: 1
  #   num_val_samples_per_batch: 1
  #   max_val_samples: 12
  #   num_frames_per_sample: 6
  vae_metrics:
    _target_: src.core.callbacks.vae_metrics.VAEMetrics
    save_path: ${paths.results_dir}/metrics.parquet
  vae_embeddings:
    _target_: src.core.callbacks.vae_embeddings.VAEEmbeddings
    frame_hop_length: 96
    save_path: ${paths.results_dir}/features.parquet

logger:
  wandb:
    id: ${run_id}
    project: species_detector_pretraining
    group: sivae

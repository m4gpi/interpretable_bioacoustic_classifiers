# @package _global_

# python main.py +experiment=sivae
defaults:
  - override /model: sivae
  - override /trainer: gpu
  - override /logger: wandb

data:
  val_prop: 0.0

model:
  x_i_frame_prob: 0.5
  front_end:
    _target_: src.core.transforms.log_mel_spectrogram.LogMelSpectrogram
    sample_rate: 48000
    num_fft: 512
    fft_window_length: 512
    fft_hop_length: 384
    num_mel_bins: 64
    mel_min_hertz: 150
    mel_max_hertz: 15_000
    mel_scaling_factor: 4581.0
    mel_break_frequency: 1_750.0
  feature_encoder:
    _target_: src.core.models.components.CNNFeatureEncoder
    in_channels: 1
    block_sizes: [8, 16, 32, 64, 128]
    block_width: 4
    block_depth: 3
    block_resample: [CONV_DOWN, CONV_DOWN, CONV_DOWN, CONV_DOWN]
    padding_mode: circular
    activation: LEAK
    norm_type: LN
    dropout_prob: 0.2
  content_encoder:
    _target_: src.core.models.components.ContentEncoder
    in_channels: 512
    out_channels: 128
    layer_sizes: [3072, 768, 256]
    dropout_prob: 0.1
    activation: LEAK
  content_decoder:
    _target_: src.core.models.components.ContentDecoder
    in_channels: 128
    out_channels: 512
    out_height: 6
    out_width: 4
    layer_sizes: [128, 768, 3072]
    dropout_prob: 0.1
    activation: LEAK
  feature_decoder:
    _target_: src.core.models.components.CNNFeatureDecoder
    out_channels: 1
    block_sizes: [128, 64, 32, 16, 8]
    block_width: 4
    block_depth: 3
    block_resample: [CONV_UP, CONV_UP, CONV_UP, CONV_UP]
    padding_mode: circular
    activation: LEAK
    norm_type: LN
    dropout_prob: 0.2
  alignment_encoder:
    _target_: src.core.models.components.XAlignmentEncoder
    out_features: 2
    x_channels: 512
    x_time_dim: 6
    x_freq_dim: 4
    activation: ATAN2

trainer:
  max_steps: 180_000
  max_epochs: -1
  log_every_n_steps: 50
  limit_val_batches: 0.0

callbacks:
  primary_model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.checkpoint_dir}/sivae/${run_id}
    filename: '{step}'
    every_n_train_steps: 20_000
    save_top_k: -1
  figure_logger:
    _target_: src.core.callbacks.figure_logger.FigureLogger
    log_every_n_train_steps: 1000
    num_train_samples_per_batch: 1
    num_val_samples_per_batch: 1
    max_val_samples: 12
    num_frames_per_sample: 6
  vae_metrics:
    _target_: src.core.callbacks.vae_metrics.VAEMetrics
    model_name: ${run_id}
    dataset_name: ${data._target_}
    save_path: ${paths.results_dir}/metrics.parquet
  vae_embeddings:
    _target_: src.core.callbacks.vae_embeddings.VAEEmbeddings
    frame_hop_length: 96
    save_path: ${paths.results_dir}

logger:
  wandb:
    id: ${run_id}
    project: soundscape_vae_pt
    group: sivae

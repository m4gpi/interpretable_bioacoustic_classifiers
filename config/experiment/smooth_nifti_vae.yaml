# @package _global_

# python main.py +experiment=smooth_nifti_vae

defaults:
  - override /model: smooth_nifti_vae
  - override /data: sounding_out_chorus
  - override /trainer: gpu
  - override /logger: null

train: true
test: true
seed: 42

data:
  seed: ${seed}
  root: ${oc.env:HOME}/data/sounding_out

trainer:
  max_steps: 180_000
  max_epochs: -1
  log_every_n_steps: 100
  val_check_interval: 2500

callbacks:
  model_checkpoint:
    dirpath: ${paths.model_dir}/checkpoints/intra_frame_shift_invariant_temporally_smooth
    filename: 'ds=chorus_{step}'
    every_n_train_steps: 60_000
    save_top_k: -1

logger:
  wandb:
    id: ${run_id}
    project: species_detector_pretraining
    group: intra_frame_shift_invariant_temporally_smooth_vae

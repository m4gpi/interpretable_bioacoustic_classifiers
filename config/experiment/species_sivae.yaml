# @package _global_

# python main.py +experiment=sivae
defaults:
  - override /model: species_sivae
  - override /trainer: gpu
  - override /logger: wandb

model_name: tan-ohio
scope: SO_UK
vae_ckpt_path: ${oc.env:HOME}/models/v1/sivae/${model_name}/step=180000.ckpt
clf_ckpt_path: ${oc.env:HOME}/models/v1/species_detectors/${model_name}_${scope}.ckpt

data:
  training_mode: epoch

model:
  _target_: src.core.models.species_sivae.SpeciesSIVAE
  classifier:
    _target_: src.core.models.species_detector.SpeciesDetector
    in_features: 128
    lamdba: 0.01
    beta: 0.0
    label_smoothing: 0.0
    attn_dim: 10
  front_end:
    _target_: src.core.transforms.log_mel_spectrogram.LogMelSpectrogram
    sample_rate: 48000
    num_fft: 512
    fft_window_length: 512
    fft_hop_length: 384
    num_mel_bins: 64
    mel_min_hertz: 150
    mel_max_hertz: 15_000
    mel_scaling_factor: 4581.0
    mel_break_frequency: 1_750.0
  feature_encoder:
    _target_: src.core.models.components.CNNFeatureEncoder
    in_channels: 1
    block_sizes: [8, 16, 32, 64, 128]
    block_width: 4
    block_depth: 3
    block_resample: [CONV_DOWN, CONV_DOWN, CONV_DOWN, CONV_DOWN]
    padding_mode: circular
    activation: LEAK
    norm_type: LN
    dropout_prob: 0.2
  content_encoder:
    _target_: src.core.models.components.ContentEncoder
    in_channels: 512
    out_channels: 128
    layer_sizes: [3072, 1536, 256]
    dropout_prob: 0.1
    activation: LEAK
  content_decoder:
    _target_: src.core.models.components.ContentDecoder
    in_channels: 128
    out_channels: 512
    out_height: 6
    out_width: 4
    layer_sizes: [128, 1536, 3072]
    dropout_prob: 0.1
    activation: LEAK
  feature_decoder:
    _target_: src.core.models.components.CNNFeatureDecoder
    out_channels: 1
    block_sizes: [128, 64, 32, 16, 8]
    block_width: 4
    block_depth: 3
    block_resample: [CONV_UP, CONV_UP, CONV_UP, CONV_UP]
    padding_mode: circular
    activation: LEAK
    norm_type: LN
    dropout_prob: 0.2

trainer:
  max_epochs: 10
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.checkpoint_dir}/${model_name}-${scope}
    filename: '{step}'
  species_scores:
    _target_: src.core.callbacks.species_scores.SpeciesScores
    save_dir: ${paths.results_dir}
    model_name: ${model_name}
    scope: ${scope}
    run_id: ${run_id}
    seed: ${seed}
    log_every_n_train_epochs: 1

logger:
  wandb:
    id: ${run_id}
    project: species_vae
    group: sivae

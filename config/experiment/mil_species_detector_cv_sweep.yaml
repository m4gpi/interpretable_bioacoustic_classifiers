# @package _global_

# python src/cli/train.py +experiment=species_detector

defaults:
  - override /data: soundscape_embeddings
  - override /model: mil_species_detector
  - override /trainer: gpu
  - override /logger: wandb

model_name: null
scope: null
test: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      data.fold_id: 0,1,2,3,4
      model.clf_learning_rate: 0.1,0.05,0.03,0.01
      model.attn_learning_rate: 0.001,0.0005
      model.gamma_clf: 0.001,0.0005,0.0001
      model.gamma_attn: 0.01,0.001

data:
  num_folds: 5
  chunked: true
  train_sample_size: 1
  eval_sample_size: 50
  root: ${paths.data_dir}/soundscape_vae_embeddings/${model_name}/${scope}

trainer:
  max_epochs: 2000
  val_check_interval: 50

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.checkpoint_dir}
    filename: ${model_name}_${scope}
  species_scores:
    _target_: src.core.callbacks.species_scores.SpeciesScores
    save_dir: ${paths.results_dir}/${model_name}_cross_validation
    model_name: ${model_name}
    scope: ${scope}
    run_id: ${run_id}
    seed: ${seed}
    fold_id: ${data.fold_id}
    log_every_n_train_epochs: 20

logger:
  wandb:
    id: ${run_id}
    project: soundscape_species_detection

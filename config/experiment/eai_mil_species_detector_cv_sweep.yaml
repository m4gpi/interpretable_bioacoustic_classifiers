# @package _global_

# python src/cli/train.py +experiment=eai_mil_species_detector_cv_sweep

defaults:
  - override /data: soundscape_embeddings
  - override /model: mil_species_detector
  - override /trainer: gpu
  - override /logger: wandb

model_name: acoustic_indices
scope: null
test: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      scope: SO_UK,SO_EC,RFCX_bird,RFCX_frog
      data.fold_id: 0,1,2,3,4
      model.clf_learning_rate: 0.1,0.05,0.03,0.01
      model.attn_learning_rate: 0.001,0.0005
      model.gamma_clf: 0.001,0.0005,0.0001
      model.gamma_attn: 0.01,0.001

data:
  num_folds: 5
  chunked: false
  norm: true
  train_sample_size: 1
  eval_sample_size: 1
  root: ${paths.data_dir}/acoustic_indices/${scope}

model:
  attention:
    in_features: 12
  classifiers:
    num_features: 12

trainer:
  max_epochs: 1000
  val_check_interval: 50

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.checkpoint_dir}
    filename: ${model_name}_${scope}
  species_scores:
    _target_: src.core.callbacks.species_scores.SpeciesScores
    save_dir: ${paths.results_dir}/eai_cross_validation
    model_name: ${model_name}
    scope: ${scope}
    run_id: ${run_id}
    seed: ${seed}
    fold_id: ${data.fold_id}
    log_every_n_train_epochs: 20

logger:
  wandb:
    id: ${run_id}
    project: soundscape_species_detection

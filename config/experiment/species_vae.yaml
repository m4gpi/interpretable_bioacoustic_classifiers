# @package _global_

# python main.py +experiment=species_vae

defaults:
  - override /model: species_vae
  - override /trainer: gpu
  - override /logger: wandb

trainer:
  max_epochs: 10
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

callbacks:
  model_checkpoint:
    dirpath: ./checkpoints/species_vae.pt:v2
    filename: model
    every_n_epochs: 10
    save_top_k: 1
  species_scores:
    _target_: src.core.callbacks.species_scores.SpeciesScores
    model: species_vae
    version: v2
    scope: UK
    save_dir: ${paths.results_dir}
    run_id: ${run_id}

logger:
  wandb:
    id: ${run_id}
    project: species_vae
    group: base

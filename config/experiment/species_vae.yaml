# @package _global_

# python main.py +experiment=species_vae

defaults:
  - override /model: vae
  - override /trainer: gpu
  - override /logger: wandb

model:
  _target_: src.core.models.species_vae.SpeciesVAE
  clf_checkpoint_path: null # FILLMEIN
  classifier:
    _target_: src.core.models.species_detector.SpeciesDetector
    in_features: 128
    lamdba: 0.1
    beta: 0.0
    label_smoothing: 0.0
    attn_dim: 10

trainer:
  max_epochs: 10
  log_every_n_steps: 50
  check_val_every_n_epoch: 1


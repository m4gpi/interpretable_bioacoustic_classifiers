# @package _global_

# python src/cli/train.py +experiment=species_detector

defaults:
  - override /data: soundscape_embeddings
  - override /model: species_detector
  - override /trainer: gpu
  - override /logger: wandb

project: species_detector
train: true
test: true
seed: 42

model:
  seed: ${seed}

data:
  root: ${paths.data_dir}/soundscape_vae_embeddings
  seed: ${seed}

trainer:
  max_epochs: 2000
  log_every_n_steps: 1
  check_val_every_n_epoch: 10

callbacks:
  model_checkpoint:
    dirpath: ${paths.results_dir}/checkpoints
    filename: ${data.scope}_${data.model}.pt:${data.version}
  species_scores:
    _target_: src.core.callbacks.species_scores.SpeciesScores
    model: ${data.model}
    version: ${data.version}
    scope: ${data.scope}
    save_dir: ${paths.results_dir}
    run_id: ${run_id}
    fold_id: ${data.fold_id}

logger:
  wandb:
    id: ${run_id}
    resume: null
    project: ${project}

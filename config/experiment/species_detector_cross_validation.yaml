# @package _global_

# python src/cli/train.py +experiment=species_detector

defaults:
  - override /data: soundscape_embeddings
  - override /model: species_detector
  - override /trainer: gpu

model_name: null
scope: null

data:
  root: ${paths.data_dir}/soundscape_vae_embeddings/${model_name}/${scope}

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      data.fold_id: 0,1,2,3,4
      model.clf_learning_rate: 1e-1,5e-2,3e-2,1e-2
      model.lamdba: 1e-1,5e-2,1e-2
      model.attn_learning_rate: 1e-3,5e-4
      model.attn_weight_decay: 1e-2,1e-3

trainer:
  max_epochs: 2000
  log_every_n_steps: 10
  check_val_every_n_epoch: 50

callbacks:
  species_scores:
    _target_: src.core.callbacks.species_scores.SpeciesScores
    save_dir: ${paths.results_dir}
    model_name: ${model_name}
    scope: ${scope}
    run_id: ${run_id}
    seed: ${seed}
    fold_id: ${data.fold_id}
    log_every_n_train_epochs: 20

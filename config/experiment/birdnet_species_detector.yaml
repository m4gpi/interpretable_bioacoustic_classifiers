# @package _global_

# python main.py train +experiment=species_detector

defaults:
  - override /data: soundscape_embeddings
  - override /model: species_detector
  - override /trainer: gpu
  - override /logger: wandb

project: species_detector
train: true
test: true
seed: 42

model:
  seed: ${seed}
  in_features: 1024

data:
  seed: ${seed}
  root: ${paths.data_dir}/soundscape_birdnet_embeddings
  model: birdnet
  version: v0
  chunked: false
  val_prop: 0.0

trainer:
  max_epochs: 2000
  log_every_n_steps: 1
  check_val_every_n_epoch: 10

callbacks:
  model_checkpoint:
    dirpath: ${paths.results_dir}/checkpoints/${run_id}
    filename: epoch_{epoch:03d}
    monitor: val/loss
    mode: min
    save_top_k: 1
    auto_insert_metric_name: False
    save_last: True
  species_scores:
    _target_: src.core.callbacks.species_scores.SpeciesScores
    model: ${data.model}
    version: ${data.version}
    scope: ${data.scope}
    save_dir: ${paths.results_dir}
    run_id: ${run_id}
    fold_id: ${data.fold_id}

logger:
  wandb:
    id: ${run_id}
    resume: null
    project: ${project}

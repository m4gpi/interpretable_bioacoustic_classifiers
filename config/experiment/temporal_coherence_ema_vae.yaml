# @package _global_

# python main.py +experiment=temporal_coherence_ema_vae

defaults:
  - override /model: temporal_coherence_ema_vae
  - override /trainer: gpu
  - override /logger: wandb

model:
  sigma_x: 0.2
  alpha: 0.85
  delta_sigma_step_start: 0
  delta_sigma_step_end: 20_000
  delta_sigma_min: 0.1
  delta_sigma_max: 2.0
  delta_sigma_step_slope: 0.4
  learning_rate: 4.e-5
  optimiser_cls: torch.optim.AdamW
  scheduler_cls: torch.optim.lr_scheduler.CosineAnnealingLR
  scheduler_config:
    T_max: 40_000
    eta_min: 4.e-7

trainer:
  max_steps: 100_000
  max_epochs: -1
  log_every_n_steps: 100
  val_check_interval: 2500

callbacks:
  model_checkpoint:
    dirpath: ${paths.root_dir}/checkpoints/tc_ema_vae.pt:v1/
    filename: model
    every_n_train_steps: 25_000
    save_top_k: 1

logger:
  wandb:
    id: ${run_id}
    project: temporal_coherence_ema
